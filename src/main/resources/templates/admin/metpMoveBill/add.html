<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('台站迁移变更核准申报表')"/>
</head>
<body>
<form class="layui-form">
    <div class="mainBox">
        <div class="main-container">
            <fieldset class="layui-elem-field layui-field-title">
                <legend>台站迁移变更核准申报表（现行单式）</legend>
            </fieldset>
            <div class="layui-form-item">
                <label class="layui-form-label">台站编号 <span style="color:#FF5722">*</span></label>
                <div class="layui-input-inline">
                    <input type="text" name="siteNo" autocomplete="off" placeholder="如 TQ00" class="layui-input">
                </div>
                <label class="layui-form-label">台站名称 <span style="color:#FF5722">*</span></label>
                <div class="layui-input-inline">
                    <input type="text" name="siteName" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">申请事由 <span style="color:#FF5722">*</span></label>
                <div class="layui-input-block">
                    <textarea name="reason" placeholder="为何迁、探测环境受何影响" class="layui-textarea"></textarea>
                </div>
            </div>
            <fieldset class="layui-elem-field layui-field-title">
                <legend>新址情形</legend>
            </fieldset>
            <div class="layui-form-item">
                <label class="layui-form-label">新址编号 <span style="color:#FF5722">*</span></label>
                <div class="layui-input-inline">
                    <input type="text" name="newSiteNo" autocomplete="off" placeholder="如 TQ00-N" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">经度 <span style="color:#FF5722">*</span></label>
                <div class="layui-input-inline">
                    <input type="number" step="0.000001" name="newLng" autocomplete="off" placeholder="十进制度" class="layui-input">
                </div>
                <label class="layui-form-label">纬度 <span style="color:#FF5722">*</span></label>
                <div class="layui-input-inline">
                    <input type="number" step="0.000001" name="newLat" autocomplete="off" placeholder="十进制度" class="layui-input">
                </div>
                <label class="layui-form-label">海拔(米) <span style="color:#FF5722">*</span></label>
                <div class="layui-input-inline">
                    <input type="number" step="0.01" name="newAlt" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">下垫面情形 <span style="color:#FF5722">*</span></label>
                <div class="layui-input-block">
                    <textarea name="surface" placeholder="新址下垫面：地形、植被、周边建筑等" class="layui-textarea"></textarea>
                </div>
            </div>
            <fieldset class="layui-elem-field layui-field-title">
                <legend>旧址与对比观测</legend>
            </fieldset>
            <div class="layui-form-item">
                <label class="layui-form-label">旧址观测场现状 <span style="color:#FF5722">*</span></label>
                <div class="layui-input-block">
                    <textarea name="oldFieldStatus" placeholder="旧址观测场现状；先建后迁，新站未起不许拆旧站" class="layui-textarea"></textarea>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">对比观测起 <span style="color:#FF5722">*</span></label>
                <div class="layui-input-inline">
                    <input type="text" name="compareStart" id="compareStart" autocomplete="off" placeholder="yyyy-MM-dd HH:mm:ss" class="layui-input">
                </div>
                <label class="layui-form-label">对比观测止 <span style="color:#FF5722">*</span></label>
                <div class="layui-input-inline">
                    <input type="text" name="compareEnd" id="compareEnd" autocomplete="off" placeholder="yyyy-MM-dd HH:mm:ss" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">先建后迁具结</label>
                <div class="layui-input-block">
                    <input type="checkbox" name="builtSwitch" lay-skin="primary" lay-filter="built-switch"
                           title="新站已建起（省局次序关据此点印；未建起此件过不了第三处）">
                    <input type="hidden" name="newStationBuilt" id="newStationBuilt" value="0">
                </div>
            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit lay-filter="move-create">
                <i class="layui-icon layui-icon-ok"></i> 报件（第一处落印）
            </button>
            <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i> 重置
            </button>
        </div>
    </div>
</form>
<th:block th:include="include :: footer"/>
<script>
    layui.use(['form', 'jquery', 'laydate'], function () {
        let form = layui.form;
        let $ = layui.jquery;
        let laydate = layui.laydate;
        let MODULE_PATH = rootPath + "/metpMoveBill/";

        laydate.render({elem: '#compareStart', type: 'datetime', format: 'yyyy-MM-dd HH:mm:ss'});
        laydate.render({elem: '#compareEnd', type: 'datetime', format: 'yyyy-MM-dd HH:mm:ss'});

        form.on('checkbox(built-switch)', function (obj) {
            $('#newStationBuilt').val(obj.elem.checked ? 1 : 0);
        });

        form.on('submit(move-create)', function (data) {
            let loading = layer.load();
            $.ajax({
                url: MODULE_PATH + 'create',
                data: data.field,
                dataType: 'json',
                type: 'post',
                success: function (result) {
                    layer.close(loading);
                    if (result.code == 200) {
                        layer.msg(result.msg, {icon: 1, time: 1200}, function () {
                            parent.layer.close(parent.layer.getFrameIndex(window.name));
                            parent.layui.table.reload('move-bill-table');
                        });
                    } else {
                        layer.msg(result.msg, {icon: 2, time: 2500});
                    }
                },
                error: function () {
                    layer.close(loading);
                    layer.msg('报件请求失败', {icon: 2});
                }
            });
            return false;
        });
    });
</script>
</body>
</html>
